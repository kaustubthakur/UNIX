
CH=22                                   # RFCOMM channel advertised over SDP
DEV=/dev/rfcomm0                        # Serial device node
PHONE_MAC=""                            # Leave empty to accept any paired phone

VOL_STEP=5                              # Default step for vol-up / vol-down (%)
SEEK_STEP=10                            # Default step for seek-fwd / seek-back (s)

ART_SIZE="400x400>"                     # ImageMagick thumbnail geometry
ART_QUALITY=80                          # JPEG quality (1-100)
CACHE_MAX_MB=20                         # Max RAM/disk cover-art cache size

LOG_LEVEL="INFO"                        # DEBUG | INFO | WARN | ERROR
